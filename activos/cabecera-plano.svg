<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="SirHegel — economía, sistemas de agentes, filosofía">
  <title>SirHegel</title>

  <defs>
    <linearGradient id="fondo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1100" y2="380">
      <stop offset="0"    stop-color="#08090D"/>
      <stop offset="0.58" stop-color="#0E1016"/>
      <stop offset="1"    stop-color="#151821"/>
    </linearGradient>

    <radialGradient id="brasa" cx="0.86" cy="0.14" r="0.72">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="oroRegla" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="560" y2="0">
      <stop offset="0"   stop-color="#C9A227" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#8C6F2A" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#8C6F2A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="marfil" gradientUnits="userSpaceOnUse" x1="92" y1="60" x2="700" y2="160">
      <stop offset="0"   stop-color="#FBF8F0"/>
      <stop offset="1"   stop-color="#D8D2C4"/>
    </linearGradient>

    <linearGradient id="hilo" gradientUnits="userSpaceOnUse" x1="958" y1="118" x2="1194" y2="118">
      <stop offset="0"   stop-color="#C9A227" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#C9A227" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" fill="url(#fondo)"/>
  <rect width="1280" height="380" fill="url(#brasa)"/>

  <!-- Pauta editorial: lineas finisimas, como una caja tipografica. -->
  <g stroke="#FBF8F0" stroke-opacity="0.030" stroke-width="1">
    <path d="M92 0V380M1188 0V380"/>
    <path d="M0 44H1280M0 336H1280"/>
  </g>

  <!-- ── Marca: el plano de control ──────────────────────────────────────
       Una linea que atraviesa el campo y, colgando de ella, N equipos. No es
       un adorno: es la tesis. Los agentes no forman una empresa por
       agregacion; la forman porque un plano los gobierna. -->
  <g transform="translate(958 118)">
    <path d="M0 0H236" stroke="url(#hilo)" stroke-width="1.6"/>

    <g stroke="#C9A227" stroke-opacity="0.42" stroke-width="1.1">
      <path d="M34 0V52M100 0V78M166 0V52M232 0V104"/>
    </g>

    <g fill="#0E1016" stroke="#C9A227" stroke-width="1.4">
      <rect x="16"  y="52"  width="36" height="26" rx="4"/>
      <rect x="82"  y="78"  width="36" height="26" rx="4"/>
      <rect x="148" y="52"  width="36" height="26" rx="4"/>
      <rect x="214" y="104" width="36" height="26" rx="4"/>
    </g>

    <g fill="#E8D9A0">
      <circle cx="34"  cy="0" r="3.4"/>
      <circle cx="100" cy="0" r="3.4"/>
      <circle cx="166" cy="0" r="3.4"/>
      <circle cx="232" cy="0" r="3.4"/>
    </g>

    <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="10.5"
       fill="#8C7A46" letter-spacing="2.4">
      <text x="0" y="-16">CONTROL PLANE</text>
    </g>
  </g>

  <!-- ── Tipografia ───────────────────────────────────────────────────── -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif">
    <text x="92" y="150" font-size="82" font-weight="700" fill="url(#marfil)" letter-spacing="-2">SirHegel</text>
  </g>

  <path d="M92 180H560" stroke="url(#oroRegla)" stroke-width="1.8"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="92" y="214" font-size="12.5" fill="#C9A227" letter-spacing="4.2">
      ECONOMÍA · SISTEMAS DE AGENTES · FILOSOFÍA
    </text>

    <text x="92" y="256" font-size="17.5" fill="#CFCBBF" letter-spacing="0.1">
      Construyo el plano que convierte agentes dispersos en una empresa operable.
    </text>
    <text x="92" y="284" font-size="17.5" fill="#8B909C" letter-spacing="0.1">
      Materialismo filosófico, crítica de la economía política, lógica hegeliana.
    </text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="92" y="322" font-size="14" fill="#6E7280">
      Un agente no es una empresa. La diferencia es categorial, no cuantitativa.
    </text>
  </g>
</svg>

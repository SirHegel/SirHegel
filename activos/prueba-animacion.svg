<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <style>
    .css { animation: mover 2s ease-in-out infinite alternate; }
    @keyframes mover { from { opacity: .15 } to { opacity: 1 } }
  </style>
  <rect width="200" height="60" fill="#0A0F14"/>
  <circle cx="50" cy="30" r="10" fill="#3FBF87">
    <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle class="css" cx="150" cy="30" r="10" fill="#E8A44C"/>
</svg>

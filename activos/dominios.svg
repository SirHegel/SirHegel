<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Tres dominios: economía, sistemas de inteligencia artificial y filosofía">
  <title>Tres dominios</title>

  <defs>
    <linearGradient id="lienzo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0b0f28"/>
      <stop offset="1"   stop-color="#171b3c"/>
    </linearGradient>

    <linearGradient id="cardA" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="420" y2="260">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardB" gradientUnits="userSpaceOnUse" x1="470" y1="60" x2="830" y2="260">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardC" gradientUnits="userSpaceOnUse" x1="880" y1="60" x2="1240" y2="260">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#lienzo)"/>

  <!-- ── Economía ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="60" y="52" width="340" height="200" rx="18" fill="url(#cardA)" stroke="#5eead4" stroke-opacity="0.22"/>

    <!-- Serie temporal irregular: una economía real, no una curva de manual. -->
    <g transform="translate(92 96)">
      <path d="M0 44 L14 30 L28 36 L42 16 L56 26 L70 8 L84 20 L98 2"
            fill="none" stroke="#5eead4" stroke-opacity="0.75" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 52H98" stroke="#5eead4" stroke-opacity="0.25" stroke-width="1.4"/>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="92" y="184" font-size="24" fill="#e6fffa" font-weight="700">Economía</text>
    </g>
    <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" fill="#8fb6c9">
      <text x="92" y="212" font-size="14.5">Teoría heterodoxa, análisis de datos,</text>
      <text x="92" y="232" font-size="14.5">modelos que no asumen equilibrio.</text>
    </g>
  </g>

  <!-- ── Sistemas de IA ───────────────────────────────────────────────── -->
  <g>
    <rect x="470" y="52" width="340" height="200" rx="18" fill="url(#cardB)" stroke="#7dd3fc" stroke-opacity="0.22"/>

    <!-- Varios agentes convergiendo en un mismo nodo: la idea del multiharness. -->
    <g transform="translate(502 96)" stroke="#7dd3fc" stroke-opacity="0.6" stroke-width="1.8" fill="none">
      <path d="M6 6 L52 26"/>
      <path d="M6 26 L52 26"/>
      <path d="M6 46 L52 26"/>
      <path d="M52 26 L96 26"/>
    </g>
    <g transform="translate(502 96)" fill="#bae6fd">
      <circle cx="6"  cy="6"  r="4.5"/>
      <circle cx="6"  cy="26" r="4.5"/>
      <circle cx="6"  cy="46" r="4.5"/>
      <circle cx="52" cy="26" r="6.5"/>
      <circle cx="96" cy="26" r="4.5"/>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="502" y="184" font-size="24" fill="#e0f2fe" font-weight="700">Sistemas de IA</text>
    </g>
    <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" fill="#9ab6d8">
      <text x="502" y="212" font-size="14.5">Orquestación de varios modelos,</text>
      <text x="502" y="232" font-size="14.5">contabilidad de consumo, auditoría cruzada.</text>
    </g>
  </g>

  <!-- ── Filosofía ────────────────────────────────────────────────────── -->
  <g>
    <rect x="880" y="52" width="340" height="200" rx="18" fill="url(#cardC)" stroke="#c4b5fd" stroke-opacity="0.22"/>

    <!-- Dos momentos que se recogen en un tercero. -->
    <g transform="translate(912 96)" fill="none" stroke="#c4b5fd" stroke-opacity="0.6" stroke-width="1.8">
      <circle cx="20" cy="26" r="17"/>
      <circle cx="52" cy="26" r="17"/>
      <path d="M36 4 L36 48" stroke-opacity="0.35"/>
    </g>
    <g transform="translate(912 96)" fill="#ddd6fe">
      <circle cx="36" cy="26" r="4"/>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="912" y="184" font-size="24" fill="#f3e8ff" font-weight="700">Filosofía</text>
    </g>
    <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" fill="#b3a6d8">
      <text x="912" y="212" font-size="14.5">Dialéctica hegeliana y autopoiesis:</text>
      <text x="912" y="232" font-size="14.5">cómo un todo produce sus propias partes.</text>
    </g>
  </g>
</svg>

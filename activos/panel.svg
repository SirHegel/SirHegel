<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 556" width="1280" height="556"
     role="img" aria-label="Jhon Alvarez — economics, agent systems, philosophy">
  <title>Jhon Alvarez · SirHegel</title>

  <!--
    HERO · Paris, Texas

    Perspectiva atmosferica en cuatro planos: cada cordillera mas clara y menos
    contrastada que la anterior, porque el aire interpuesto dispersa la luz. Es
    lo que hace que una llanura se lea profunda y no como un recorte.

    El tendido telegrafico cruza el ancho COMPLETO del cuadro y converge hacia
    el punto de fuga, junto al sol. Los postes se acortan y se juntan segun se
    alejan. La carretera repite la misma fuga desde el borde inferior.

    LEGIBILIDAD: la placa de texto flota en el cielo y termina ANTES del
    horizonte, de modo que el paisaje corre entero por debajo sin quedar
    tapado. Ninguna letra se apoya sobre algo que se mueva.
  -->

  <defs>
    <linearGradient id="cielo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="448">
      <stop offset="0"    stop-color="#050810"/>
      <stop offset="0.26" stop-color="#0D2030"/>
      <stop offset="0.55" stop-color="#2A4A60"/>
      <stop offset="0.78" stop-color="#8B5C3E"/>
      <stop offset="0.93" stop-color="#D4813C"/>
      <stop offset="1"    stop-color="#F0A855"/>
    </linearGradient>

    <linearGradient id="suelo" gradientUnits="userSpaceOnUse" x1="0" y1="448" x2="0" y2="556">
      <stop offset="0"   stop-color="#7A4526"/>
      <stop offset="0.3" stop-color="#3D2216"/>
      <stop offset="1"   stop-color="#0D0806"/>
    </linearGradient>

    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFF0CC" stop-opacity="0.95"/>
      <stop offset="0.14" stop-color="#FFCE8A" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#E2803A" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#C4562C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="marfil" gradientUnits="userSpaceOnUse" x1="88" y1="110" x2="720" y2="200">
      <stop offset="0" stop-color="#FCF8F0"/>
      <stop offset="1" stop-color="#CFC0A6"/>
    </linearGradient>

    <linearGradient id="barrido" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="-130" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF6E2" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 0; 1900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="filete" gradientUnits="userSpaceOnUse" x1="88" y1="0" x2="600" y2="0">
      <stop offset="0"   stop-color="#D4402C"/>
      <stop offset="0.5" stop-color="#E8A44C" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#E8A44C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rayo" gradientUnits="userSpaceOnUse" x1="0" y1="448" x2="0" y2="140">
      <stop offset="0"   stop-color="#FFD9A0" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#F0A14B" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#F0A14B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="faro" gradientUnits="userSpaceOnUse" x1="-540" y1="0" x2="-170" y2="556">
      <stop offset="0"   stop-color="#FFE9C4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE9C4" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#FFE9C4" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 0; 2300 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="neon" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="a"/>
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <clipPath id="marco"><rect width="1280" height="556" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">

    <rect width="1280" height="448" fill="url(#cielo)"/>
    <rect y="448" width="1280" height="108" fill="url(#suelo)"/>

    <!-- Estrellas -->
    <g fill="#FCF8F0">
      <circle cx="128"  cy="40"  r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="342"  cy="72"  r="0.9"><animate attributeName="opacity" values="0.7;0.1;0.7"    dur="5.3s" repeatCount="indefinite"/></circle>
      <circle cx="556"  cy="32"  r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2"    dur="6.7s" repeatCount="indefinite"/></circle>
      <circle cx="792"  cy="84"  r="0.8"><animate attributeName="opacity" values="0.75;0.15;0.75" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="1004" cy="46"  r="1.0"><animate attributeName="opacity" values="0.18;0.75;0.18" dur="5.9s" repeatCount="indefinite"/></circle>
      <circle cx="1196" cy="92"  r="1.1"><animate attributeName="opacity" values="0.6;0.12;0.6"   dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="906"  cy="130" r="0.8"><animate attributeName="opacity" values="0.5;0.15;0.5"   dur="7.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Rayos volumetricos -->
    <g transform="translate(946 448)" opacity="0.9">
      <polygon points="0,0 -180,-340 -130,-340" fill="url(#rayo)"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="11s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 -66,-340 -18,-340"   fill="url(#rayo)"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="9s"  repeatCount="indefinite"/></polygon>
      <polygon points="0,0 56,-340 110,-340"    fill="url(#rayo)"><animate attributeName="opacity" values="0.4;0.95;0.4" dur="13s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 168,-340 226,-340"   fill="url(#rayo)"><animate attributeName="opacity" values="0.7;0.25;0.7" dur="10s" repeatCount="indefinite"/></polygon>
    </g>

    <!-- Sol -->
    <ellipse cx="946" cy="448" rx="300" ry="150" fill="url(#sol)">
      <animate attributeName="rx" values="300;322;300" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="946" cy="448" r="26" fill="#FFF0CC" opacity="0.85" filter="url(#halo)">
      <animate attributeName="r" values="26;29;26" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- ── MESAS · cuatro planos, del mas lejano al mas cercano ── -->
    <path d="M0 448 L0 404 L74 404 L110 392 L206 392 L238 404 L352 404 L392 386 L486 386 L520 404
             L1280 404 L1280 448 Z" fill="#6E5442" opacity="0.30"/>
    <path d="M0 448 L0 414 L128 414 L168 398 L262 398 L300 414 L556 414 L556 448 Z
             M1040 448 L1040 398 L1090 398 L1126 382 L1280 382 L1280 448 Z" fill="#4A3428" opacity="0.5"/>
    <path d="M0 448 L0 428 L96 428 L142 410 L236 410 L282 428 L430 428 L430 448 Z
             M1150 448 L1150 412 L1200 412 L1232 396 L1280 396 L1280 448 Z" fill="#2E1F17" opacity="0.72"/>
    <path d="M0 448 L0 438 L64 438 L104 424 L178 424 L214 438 L296 438 L296 448 Z" fill="#160E0A"/>

    <!-- ── CARRETERA · fuga hacia el sol ── -->
    <path d="M912 448 L1280 556 L1140 556 L900 448 Z" fill="#1A1310" opacity="0.5"/>
    <g stroke="#E8C79A" stroke-opacity="0.28" stroke-width="2">
      <path d="M910 458 L946 476"/>
      <path d="M962 502 L1016 530"/>
      <path d="M1040 566 L1112 604"/>
    </g>

    <path d="M0 448H1280" stroke="#FFC98A" stroke-opacity="0.5" stroke-width="1"/>

    <!-- ══ TENDIDO · cruza el ancho completo y converge en el sol ══
         Los postes se acortan y se juntan hacia el punto de fuga. -->
    <g>
      <path d="M40 448V300 M196 448V318 M336 448V334 M460 448V348 M568 448V360
               M662 448V370 M742 448V379 M808 448V386 M862 448V392 M906 448V397"
            stroke="#0A0806" stroke-opacity="0.9" stroke-width="2.6"/>
      <path d="M20 306 H60 M178 323 H214 M320 339 H352 M446 353 H474 M556 365 H580
               M651 375 H673 M732 384 H752 M799 391 H817 M854 397 H870 M899 402 H913"
            stroke="#0A0806" stroke-opacity="0.9" stroke-width="2"/>
      <path d="M40 300 L196 318 L336 334 L460 348 L568 360 L662 370 L742 379 L808 386 L862 392 L906 397"
            fill="none" stroke="#3FBF87" stroke-opacity="0.40" stroke-width="1.2"/>

      <g fill="#5BF0AE" filter="url(#neon)">
        <circle cx="40"  cy="300" r="3.2"><animate attributeName="r" values="2.2;6;2.2" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="196" cy="318" r="3"  ><animate attributeName="r" values="5.6;2;5.6" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="336" cy="334" r="2.8"><animate attributeName="r" values="2;5.2;2"   dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="460" cy="348" r="2.6"><animate attributeName="r" values="4.8;1.9;4.8" dur="3.3s" repeatCount="indefinite"/></circle>
        <circle cx="568" cy="360" r="2.4"><animate attributeName="r" values="1.8;4.4;1.8" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="662" cy="370" r="2.2"><animate attributeName="r" values="4;1.7;4"   dur="3.7s" repeatCount="indefinite"/></circle>
        <circle cx="742" cy="379" r="2"  ><animate attributeName="r" values="1.6;3.6;1.6" dur="2.3s" repeatCount="indefinite"/></circle>
        <circle cx="808" cy="386" r="1.8"><animate attributeName="r" values="3.2;1.5;3.2" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="862" cy="392" r="1.6"/>
        <circle cx="906" cy="397" r="1.4"/>
      </g>

      <!-- Pulsos de datos: recorren el tendido entero de izquierda a derecha -->
      <g fill="#C8FFE8" filter="url(#neon)">
        <circle r="3.4" opacity="0">
          <animateMotion dur="5s" repeatCount="indefinite" path="M40 300 L196 318 L336 334 L460 348 L568 360 L662 370 L742 379 L808 386 L862 392 L906 397"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3.4;1.4" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.4" opacity="0">
          <animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M40 300 L196 318 L336 334 L460 348 L568 360 L662 370 L742 379 L808 386 L862 392 L906 397"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="5s" begin="1.7s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3.4;1.4" dur="5s" begin="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle r="3.4" opacity="0">
          <animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M40 300 L196 318 L336 334 L460 348 L568 360 L662 370 L742 379 L808 386 L862 392 L906 397"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="5s" begin="3.4s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3.4;1.4" dur="5s" begin="3.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="10"
         fill="#5BF0AE" fill-opacity="0.62" letter-spacing="3.4">
        <text x="742" y="352">CONTROL PLANE · N TEAMS</text>
      </g>
    </g>

    <!-- Polvo en suspension -->
    <g fill="#FFE9C4">
      <circle cx="200" cy="380" r="1.3">
        <animate attributeName="cx" values="120;1200" dur="26s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="380;350;380" dur="26s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.1;0.85;1" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="300" r="1">
        <animate attributeName="cx" values="40;1240" dur="34s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;328;300" dur="34s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.42;0.42;0" keyTimes="0;0.1;0.85;1" dur="34s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="424" r="1.5">
        <animate attributeName="cx" values="180;1260" dur="30s" begin="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="424;400;424" dur="30s" begin="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.85;1" dur="30s" begin="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1280" height="556" fill="url(#faro)"/>

    <g stroke="#FCF8F0" stroke-opacity="0.038" stroke-width="1">
      <path d="M88 0V556M184 0V556M280 0V556M376 0V556M472 0V556M568 0V556M664 0V556M760 0V556M856 0V556M952 0V556M1048 0V556M1144 0V556"/>
    </g>

    <!-- ═══ PLACA · flota en el cielo, termina antes del horizonte ═══ -->
    <g>
      <rect x="56" y="52" width="632" height="340" rx="6" fill="#070A0F" fill-opacity="0.88"/>
      <rect x="56" y="52" width="632" height="340" rx="6" fill="none" stroke="#E8A44C" stroke-opacity="0.18" stroke-width="1"/>
      <path d="M56 52 V 392" stroke="#D4402C" stroke-opacity="0.75" stroke-width="2.4"/>
    </g>

    <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
       font-size="92" font-weight="700" letter-spacing="-3.5">
      <text x="88" y="152" fill="#D4813C" fill-opacity="0.22" filter="url(#halo)">SirHegel</text>
      <text x="88" y="152" fill="url(#marfil)">SirHegel</text>
      <text x="88" y="152" fill="url(#barrido)">SirHegel</text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600" letter-spacing="-0.4">
      <text x="90" y="186" fill="#C9BCA6">Jhon Alvarez</text>
    </g>

    <path d="M88 210H600" stroke="url(#filete)" stroke-width="2"/>

    <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="88" y="242" font-size="12" font-weight="700" fill="#E8A44C" letter-spacing="6">
        ECONOMICS · AGENT SYSTEMS · PHILOSOPHY
      </text>
      <text x="88" y="288" font-size="19" fill="#F2E9D8">
        I build the control plane that turns scattered
      </text>
      <text x="88" y="314" font-size="19" fill="#F2E9D8">
        agents into an operating company.
      </text>
      <text x="88" y="346" font-size="16" fill="#9C8F7C">
        Philosophical materialism, critique of political economy.
      </text>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-style="italic">
      <text x="88" y="374" font-size="14" fill="#847866">
        An agent is not a company. The difference is categorial.
      </text>
    </g>

    <rect width="1280" height="556" filter="url(#grano)" opacity="0.05" style="mix-blend-mode:overlay"/>
  </g>
</svg>
